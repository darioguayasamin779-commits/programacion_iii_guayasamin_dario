<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Estudiantes - IDIOMIA</title>
    <script src="06_crud_arreglo_mp_guayasamin_dario.js" defer></script>
</head>
<body>
    <h1>Registro de Estudiantes IDIOMIA</h1>
    <h2 id="tituloFormulario">Registrar Estudiante</h2>
    <form id="formulario">
        <input type="text"
        id="nombre"
        placeholder="Nombre del estudiante">
        <select id="idioma">
            <option value="Ingles">Ingles</option>
            <option value="Frances">Frances</option>
            <option value="Aleman">Aleman</option>
        </select>
        <select id="nivel">
            <option value="A1">A1</option>
            <option value="B1">B1</option>
            <option value="C1">C1</option>
        </select>
        <button type="submit" id="guardar">Agregar</button>
        <button type="button" id="cancelar" hidden>Cancelar</button>
    </form>
    <p id="mensaje"></p>
    <h2>Estudiantes Matriculados</h2>
    <h2 id="cantidad">Cantidad</h2>
    <div id="contenedor"></div>
</body>
</html>
