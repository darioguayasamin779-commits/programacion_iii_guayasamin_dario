<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">


    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>Viaje de Idiomas IDIOMIA</title>


    <link rel="stylesheet" href="19_transiciones_integracion_mp_guayasamin_dario.css">
</head>
<body>


    <header>
        <h1>Viaje de Idiomas</h1>


        <p>
            Simulación de una clase
            de la academia IDIOMIA.
        </p>
    </header>


    <main>


        <section class="escena"
                 aria-label="Escena animada de palabras en varios idiomas">


            <div class="letra letra1"></div>
            <div class="letra letra2"></div>
            <div class="letra letra3"></div>
            <div class="letra letra4"></div>
            <div class="letra letra5"></div>


            <div class="globo">
                <span aria-hidden="true">Hola</span>
                <p>Español</p>
            </div>


            <div class="alerta">
                EXAMEN EN CURSO
            </div>


        </section>


        <section class="controles">


            <h2>Centro de aprendizaje</h2>


            <div class="panel">


                <article class="progreso-contenedor">


                    <h3>Progreso de pronunciación</h3>


                    <div class="progreso"
                         aria-hidden="true">


                        <div class="pulso"></div>


                        <div class="centro"></div>


                    </div>


                </article>


                <article class="estado">


                    <h3>Estado de la clase</h3>


                    <p>
                        Lección de vocabulario activa.
                    </p>


                    <p>
                        Idioma: Inglés
                    </p>


                    <p>
                        Docente: Darío
                    </p>


                </article>


            </div>


        </section>


    </main>


    <footer>
        <p>Academia IDIOMIA - 2026</p>
    </footer>


</body>
</html>
