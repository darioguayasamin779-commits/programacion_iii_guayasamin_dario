<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transiciones - IDIOMIA</title>
    <link rel="stylesheet" href="18_transiciones_mp_guayasamin_dario.css">
</head>
<body>
    <main>
        <h1>Palabras en movimiento</h1>
        <div class="espacio">
            <div class="palabra">Hello</div>
        </div>
        <div class="espacio2">
            <div class="palabra2">Bonjour</div>
        </div>
        <div class="alerta">
            <div class="palabra">Hallo</div>
        </div>
        <h1>Academia IDIOMIA</h1>
        <p>Coloca el cursor sobre el botón</p>
        <button class="boton-idioma">
            Iniciar lección
        </button>
        <div class="tarjeta">
            <h2>Darío</h2>
            <p>Profesor de inglés</p>
        </div>
    </main>

    <br>
    <br>
    <h1>Aula de vocabulario</h1>
    <div class="aula">
        <div class="ficha">Ciao</div>
    </div>
    <h1>Rueda de idiomas</h1>
    <div class="rueda">
        <div class="indicador">Aa</div>
    </div>
    <h1>Aula de vocabulario 2</h1>
    <div class="aula2">
        <div class="ficha2">Olá</div>
    </div>
</body>
</html>
